name: Android Release APK Build & Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name (e.g. 1.0.2). Leave empty for automatic 1.0.<run_number>."
        required: false
        default: ""
      release_notes:
        description: "Optional custom release notes"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign, Verify & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & Accept Licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK directory not found at $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER_BIN="$(find "$SDK_ROOT" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n "$SDKMANAGER_BIN" ]]; then
            echo "Using sdkmanager: $SDKMANAGER_BIN"
            set +o pipefail
            yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          else
            echo "::warning::sdkmanager not found under $SDK_ROOT; relying on pre-accepted SDK licenses."
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Compute Version Metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          VERSION_CODE="${{ github.run_number }}"
          if [[ -z "$VERSION_CODE" || "$VERSION_CODE" -lt 1 ]]; then
            VERSION_CODE="1"
          fi

          CLEAN_INPUT="$(echo "$INPUT_VERSION_NAME" | xargs)"
          CLEAN_INPUT="${CLEAN_INPUT#v}"
          CLEAN_INPUT="${CLEAN_INPUT#V}"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_NAME="${VERSION_NAME#V}"
          elif [[ -n "$CLEAN_INPUT" ]]; then
            VERSION_NAME="$CLEAN_INPUT"
          else
            VERSION_NAME="1.0.${{ github.run_number }}"
          fi

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Configure Environment & Keystores
        id: envsetup
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [[ ! -f debug.keystore ]]; then
            if [[ -f debug.keystore.base64 ]]; then
              tr -d '\n\r ' < debug.keystore.base64 | base64 -d > debug.keystore
              echo "Restored debug.keystore from debug.keystore.base64."
            else
              keytool -genkeypair \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 3650 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug, O=Android, C=US"
              echo "Generated temporary debug.keystore for CI build."
            fi
          fi

          if [[ -n "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\n\r ' | base64 -d > app/google-services.json
            echo "google_services_mode=secret" >> "$GITHUB_OUTPUT"
            echo "Restored app/google-services.json from GitHub Secret."
          elif [[ -f app/google-services.json ]]; then
            echo "google_services_mode=repo" >> "$GITHUB_OUTPUT"
            echo "Preserving repository app/google-services.json."
          else
            echo "google_services_mode=missing" >> "$GITHUB_OUTPUT"
            echo "::warning::app/google-services.json is not present and GOOGLE_SERVICES_JSON_BASE64 secret is not configured. Building APK with passthrough Firebase config; add GOOGLE_SERVICES_JSON_BASE64 in GitHub Secrets for live Firebase Auth/Firestore in the published APK."
          fi

          if [[ ! -f .env && -f .env.example ]]; then
            cp .env.example .env
          fi

      - name: Prepare Android Signing Keystore
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/my-upload-key.jks"
          RESOLVED_STORE_PASS="${SECRET_STORE_PASSWORD:-$SECRET_KEYSTORE_PASSWORD}"
          RESOLVED_KEY_PASS="${SECRET_KEY_PASSWORD:-$RESOLVED_STORE_PASS}"

          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$RESOLVED_STORE_PASS" && -n "$RESOLVED_KEY_PASS" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_FILE"
            if ! keytool -list -keystore "$KEYSTORE_FILE" -alias upload -storepass "$RESOLVED_STORE_PASS" >/dev/null 2>&1; then
              echo "::error::ANDROID_KEYSTORE_BASE64 could not be opened with alias 'upload' and STORE_PASSWORD."
              exit 1
            fi
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$RESOLVED_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$RESOLVED_KEY_PASS" >> "$GITHUB_ENV"
            echo "signing_mode=secret" >> "$GITHUB_OUTPUT"
            echo "Using release signing keystore from GitHub Secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 or STORE_PASSWORD secret not set. Generating an ephemeral CI keystore for this workflow run."
            EPHEMERAL_PASS="$(openssl rand -hex 16)"
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -storepass "$EPHEMERAL_PASS" \
              -keypass "$EPHEMERAL_PASS" \
              -dname "CN=Binace Smart Earn CI, OU=Mobile, O=Binace Smart Earn, L=Karachi, S=Sindh, C=PK"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "signing_mode=ephemeral" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests "com.example.ExampleUnitTest" \
            --tests "com.example.ExampleRobolectricTest" \
            --tests "com.example.ReferralAndUpdateTest" \
            --tests "com.example.PlatformSystemsTest" \
            --no-daemon

      - name: Build Signed Release APK
        run: |
          gradle :app:assembleRelease \
            -PVERSION_CODE="${{ steps.meta.outputs.version_code }}" \
            -PVERSION_NAME="${{ steps.meta.outputs.version_name }}" \
            -PGITHUB_REPOSITORY="${{ github.repository }}" \
            --no-daemon

      - name: Sign (v1/v2/v3), Verify & Stage Release APKs
        shell: bash
        env:
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$SOURCE_APK" ]]; then
            echo "::error::Expected release APK not found at $SOURCE_APK"
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ZIPALIGN_BIN="$(find "$SDK_ROOT/build-tools" -name zipalign -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          APKSIGNER_BIN="$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"

          mkdir -p release-assets
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/app-release-signed.apk"

          if [[ -n "$ZIPALIGN_BIN" && -n "$APKSIGNER_BIN" ]]; then
            "$ZIPALIGN_BIN" -f -p 4 "$SOURCE_APK" "$ALIGNED_APK"
            "$APKSIGNER_BIN" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias upload \
              --ks-pass "pass:$STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"
            "$APKSIGNER_BIN" verify --verbose --print-certs "$SIGNED_APK"
            cp "$SIGNED_APK" "release-assets/BINACE-SMART-EARN.apk"
            cp "$SIGNED_APK" "release-assets/binace-smart-earn-v${{ steps.meta.outputs.version_name }}.apk"
          else
            if [[ -n "$APKSIGNER_BIN" ]]; then
              "$APKSIGNER_BIN" verify --print-certs "$SOURCE_APK"
            fi
            cp "$SOURCE_APK" "release-assets/BINACE-SMART-EARN.apk"
            cp "$SOURCE_APK" "release-assets/binace-smart-earn-v${{ steps.meta.outputs.version_name }}.apk"
          fi

          ls -lh release-assets/

          NOTES_TEXT="$INPUT_RELEASE_NOTES"
          if [[ -z "${NOTES_TEXT// /}" ]]; then
            NOTES_TEXT="Automated Android release build verified with unit tests and v1/v2/v3 signed APK packaging."
          fi

          cat <<EOF > "$RUNNER_TEMP/release-body.md"
          ## BINACE SMART EARN v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }})

          ${NOTES_TEXT}

          ### Direct Public APK Download URLs
          - **Latest Always (BINACE-SMART-EARN.apk):** https://github.com/${{ github.repository }}/releases/latest/download/BINACE-SMART-EARN.apk
          - **Versioned APK:** https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag_name }}/binace-smart-earn-v${{ steps.meta.outputs.version_name }}.apk

          ### Installation Note
          - If Android shows *"App not installed"* when installing over an earlier debug or ephemeral CI build, uninstall the previous Binace Smart Earn app first (certificate mismatch protection in Android), then install the downloaded APK.
          - Signing mode: \`${{ steps.signing.outputs.signing_mode }}\`
          - Firebase config: \`${{ steps.envsetup.outputs.google_services_mode }}\`
          - Official Website: https://binacesmartearn.online
          EOF

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binace-smart-earn-v${{ steps.meta.outputs.version_name }}
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release & Attach APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: BINACE SMART EARN v${{ steps.meta.outputs.version_name }}
          make_latest: "true"
          generate_release_notes: true
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            release-assets/BINACE-SMART-EARN.apk
            release-assets/binace-smart-earn-v${{ steps.meta.outputs.version_name }}.apk

      - name: Publish Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### BINACE SMART EARN Release Summary"
            echo "- **Version:** \`v${{ steps.meta.outputs.version_name }}\` (Build \`${{ steps.meta.outputs.version_code }}\`)"
            echo "- **Tag:** \`${{ steps.meta.outputs.tag_name }}\`"
            echo "- **Public Latest APK URL:** https://github.com/${{ github.repository }}/releases/latest/download/BINACE-SMART-EARN.apk"
            echo "- **Signing Mode:** \`${{ steps.signing.outputs.signing_mode }}\`"
            echo "- **Firebase Config:** \`${{ steps.envsetup.outputs.google_services_mode }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
